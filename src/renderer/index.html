<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideloadX</title>
    <style>
      /* Prevent text selection in Electron */
      body { -webkit-user-select: none; user-select: none; }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0f1628; }
      ::-webkit-scrollbar-thumb { background: #2d3c5e; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #3b4c70; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
